name: Publish Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
      - conf/**
  # Weekly rebuild picks up Debian and PHP patch releases even when nothing
  # here changed (the app repo's Dependabot then bumps the pinned digest).
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PHP_VERSION: '8.5'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PHP_VERSION }}
            type=sha,prefix=${{ env.PHP_VERSION }}-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scheduled runs skip the layer cache so apt-get actually fetches
          # updated packages even when the upstream base digests are unchanged.
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
