; Production overrides on top of php.ini-production. The `zz-` prefix makes
; this load after the extension ini files in conf.d.

expose_php = Off

; Images are immutable, so never stat files for changes: code only changes by
; deploying a new image (which starts with an empty opcache).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
; Laravel + vendor easily passes the 10000 default.
opcache.max_accelerated_files = 20000
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
