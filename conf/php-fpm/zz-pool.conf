; Pool tuning for the `www` pool. Loads after the official image's www.conf,
; docker.conf and zz-docker.conf, so these values win. Each value reads an
; env var (defaults set in the Dockerfile) so apps can resize per deployment
; without rebuilding the image.

[www]
pm = dynamic
; Size to the container's memory: roughly 40-60 MB per worker for Laravel.
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
; Recycle workers periodically to cap slow memory leaks.
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}

; Wall-clock cap per request. max_execution_time only counts CPU time on
; Linux, so a request stuck on network I/O would otherwise hold a worker.
request_terminate_timeout = ${PHP_FPM_REQUEST_TERMINATE_TIMEOUT}

; Reachable only over FastCGI on 127.0.0.1:9000 (nginx doesn't route them).
; Probe with: SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000
ping.path = /fpm-ping
pm.status_path = /fpm-status
